name: Public Source Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-browser-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python source syntax
        run: python -m compileall -q src tests scripts
      - name: Frontend logic tests (no external services)
        run: node --test tests/frontend/*.test.js
